# Build and test on every push and pull request. No GPU on the runners: the renderer library and
# its shaders are compiled (glslangValidator, warnings as errors under clang, the class of
# warnings the NDK rejects and MSVC lets through) but not run; the golden-image tests need the
# desktop host and local scenes and stay on the development machine (CLAUDE.md section 7).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: core, tools, renderer library, tests (Linux, clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang glslang-tools
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DPOCKETSPLAT_BUILD_RENDER=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  android:
    name: Android app (debug APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install glslangValidator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends glslang-tools
      - name: Install the pinned NDK and CMake (android/app/build.gradle.kts)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;4.1.2" > /dev/null
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
